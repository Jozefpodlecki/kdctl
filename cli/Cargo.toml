[package]
name = "kdctl-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
log = "0.4.18"
flexi_logger = { version = "0.31.9", features = ["colors"] }
anyhow = "1.0.75"
clap = { version = "4.4", features = ["derive"] }
windows-service = "0.8.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
kdctl-shared = { path = "../shared" }